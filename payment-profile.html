<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Payment Profile | BrightMinds</title>
        <link rel="stylesheet" href="payment_profile_styles.css">
        <script src="payment_profile_script.js" defer></script>
    </head>

    <body>
        <main>
            <h1>Payment Details</h1>

            <div class="card">
            <p><strong>Learner</strong></p>
            <p><span class="payment-name"></span></p>
            </div>

            <div class="card">
                <p><strong>Amount</strong></p>
                <p><span class="payment-amount"></span></p>
            </div>

            <div class="card">
                <p><strong>Date</strong></p>
                <p><span class="payment-date"></span></p>
            </div>

            <div class="card">
                <p><strong>Payment Method</strong></p>
                <p><span class="payment-method"></span></p>
            </div>

            <div class="card">
                <p><strong>Notes</strong></p>
                <p><span class="payment-notes"></span></p>
            </div>

            <button class="back-button">Back</button>
        </main>
    </body>
</html>
