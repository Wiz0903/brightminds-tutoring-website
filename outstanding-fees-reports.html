<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Outstanding Fees Reports | BrightMinds</title>
        <link rel="stylesheet" href="outstanding_fees_reports_styles.css">
        <script src="outstanding_fees_reports_script.js" defer></script>
    </head>

    <body>
        <main>

            <h1>Outstanding Fees</h1>

            <p class="description">
                View learners with outstanding payments for the current month.
            </p>

            <section class="report-summary">

                <div class="total-outstanding">
                    <p>Total Outstanding</p>
                    <p>R<span class="outstanding-total">0.00</span></p>
                </div>

            </section>

            <section class="outstanding-report">

                <table>

                    <thead>
                        <tr>
                            <th>Learner</th>
                            <th>Grade</th>
                            <th>School</th>
                            <th>Paid This Month</th>
                            <th>Outstanding</th>
                        </tr>
                    </thead>

                    <tbody>
                        
                    </tbody>

                </table>

                <p class="no-outstanding">
                    All learners have paid their fees for this month.
                </p>

            </section>

        </main>
    </body>
</html>
