<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Attendace Report | BrightMinds</title>
        <link rel="stylesheet" href="attendance_report_styles.css">
        <script src="attendance_report_script.js" defer></script>
    </head>

    <body>
        <main>

            <h1>Attendance Report</h1>

            <p class="description">
                View learner attendance and attendance percentages.
            </p>

            <section class="attendance-summary">

                <div class="total-sessions">
                    <p>Total Sessions</p>
                    <p><span class="sessions-count">0</span></p>
                </div>

                <div class="average-attendance">
                    <p>Average Attendance</p>
                    <p><span class="average-percentage">0</span>%</p>
                </div>

            </section>

            <section class="attendance-report">

                <table>

                    <thead>
                        <tr>
                            <th>Learner</th>
                            <th>Grade</th>
                            <th>School</th>
                            <th>Sessions</th>
                            <th>Present</th>
                            <th>Attendance</th>
                        </tr>
                    </thead>

                    <tbody>

                    </tbody>

                </table>

                <p class="no-attendance">
                    No attendance records found.
                </p>

            </section>

        </main>
    </body>
</html>
