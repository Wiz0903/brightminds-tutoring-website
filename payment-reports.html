<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Payment Reports | BrightMinds</title>
        <link rel="stylesheet" href="payment_reports_styles.css">
        <script src="payment_reports_script.js" defer></script>
    </head>

    <body>
        <main>
            <h1>Payment Report</h1>
            <p class="description">
                View payments collected from learners.
            </p>

            <section class="report-filters">
                <label for="month-filter">Select Month:</label>
                <select id="month-filter">
                    <option value="">All Months</option>
                    <option value="0">January</option>
                    <option value="1">February</option>
                    <option value="2">March</option>
                    <option value="3">April</option>
                    <option value="4">May</option>
                    <option value="5">June</option>
                    <option value="6">July</option>
                    <option value="7">August</option>
                    <option value="8">September</option>
                    <option value="9">October</option>
                    <option value="10">November</option>
                    <option value="11">December</option>
                </select>
            </section>

            <section class="payment-report">
                <table>

                    <thead>
                        <tr>
                            <th>Learner</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Method</th>
                        </tr>
                    </thead>

                    <tbody>

                    </tbody>

                </table>

                <p class="no-payments">
                    No payments found.
                </p>
            </section>

            <section class="report-summary">
                <div class="total-collected">
                    <p>Total Collected</p>
                    <p>R<span class="total-amount">0.00</span></p>
                </div>
            </section>
        </main>
    </body>
</html>
