<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Payment History | BrightMinds</title>
        <link rel="stylesheet" href="payment_history_styles.css">
        <script src="payment_history_script.js" defer></script>
    </head>

    <body>
        <a href="payments.html">← Back to Payments</a>

        <main>
            <h2><span class="learner-name"></span></h2>
            <section class="learner-info">
                <p><strong>Grade:</strong> <span class="learner-grade"></span></p>
                <p><strong>School:</strong> <span class="learner-school"></span></p>
            </section>

            <h2>Payment History</h2>
            <section class="payment-history">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Method</th>
                        </tr>
                    </thead>
                    
                    <tbody>
                        
                    </tbody>
                </table>
                <p class="no-payments" style="display: none;">
                    No payments have been recorded for this learner.
                </p>
            </section>

            <section class="learner-amount">
                <div class="total-paid">
                    <p>Total Paid</p>
                    <p>R<span class="total-amount">0</span></p>
                </div>
                
                <div class="total-unpaid">
                    <p>Outstanding This Month</p>
                    <p>R<span class="outstanding-amount">0</span></p>
                </div>
            </section>
        </main>
    </body>
</html>
